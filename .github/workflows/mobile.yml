name: mobile

# Flutter app in ./mobile. Runs only when the app, or the web design tokens it is generated from, change.
on:
  push:
    branches: [develop, main]
    paths: ['mobile/**', 'resources/css/app.css', '.github/workflows/mobile.yml']
  pull_request:
    branches: [develop, main]
    paths: ['mobile/**', 'resources/css/app.css', '.github/workflows/mobile.yml']

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-path: ${{ runner.tool_cache }}/flutter

      - run: flutter pub get

      - name: Design tokens are in sync with the web stylesheet
        run: |
          dart run tool/oklch_to_hex.dart
          git diff --exit-code -- lib/core/theme/tokens.g.dart

      - run: flutter analyze

      - run: flutter test
